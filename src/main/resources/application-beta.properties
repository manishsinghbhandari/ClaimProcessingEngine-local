# Spring boot config
server.servlet.context-path=/api/v1
server.port=8080

# Disable hibernate elasticsearch sniffer
spring.autoconfigure.exclude = org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
hibernate.search.backend.discovery.enabled = false

## Swagger Config
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.info.title=Payer API
springdoc.info.version=1.0.0
openapi.url=https://payers.apeiro-digital.com

# Keycloak Configuration
keycloak.realm.uri=https://auth.apeiro-digital.com
keycloak.auth-server-url=${keycloak.realm.uri}/auth
keycloak.eportal.name=eclaimportal
keycloak.realm=camunda-platform
keycloak.client-id=claimengine
keycloak.client-secret=
## Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.realm.uri}/auth/realms/camunda-platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

  
# JWT Configuration
jwt.auth.converter.resource-id=claimengine
jwt.auth.converter.principal-attribute=principal_username

camunda.client.auth.client-id=claimengine
camunda.client.auth.client-secret=
camunda.client.auth.username=demo
camunda.client.auth.password=
camunda.client.identity.base-url=https://auth.apeiro-digital.com/auth/realms/camunda-platform
camunda.client.zeebe.base-url=http://zeebe.apeiro-digital.com/rest/
camunda.client.zeebe.gateway-url=http://zeebe.apeiro-digital.com:26500
camunda.client.auth.oidc-type=keycloak
camunda.client.auth.issuer=https://auth.apeiro-digital.com/auth/realms/camunda-platform
camunda.client.zeebe.audience=zeebe-api
camunda.client.zeebe.enabled=true
camunda.client.mode=oidc
camunda.client.zeebe.prefer-rest-over-grpc=true
camunda.client.operate.enabled=true
camunda.client.operate.base-url=http://operate.apeiro-digital.com
camunda.client.identity.enabled=true
camunda.client.tasklist.enabled=true
camunda.client.optimize.enabled=true
camunda.client.zeebe.execution-threads=30
logging.level.io.camunda.zeebe.client=ERROR

## Postgres Azure DB
spring.datasource.url=jdbc:postgresql://db-fhir-pg.postgres.database.azure.com:5432/claim?&sslmode=require
spring.datasource.username=fhirdbadmin
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.pool-name=claims-pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
