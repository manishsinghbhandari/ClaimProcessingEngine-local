## Spring boot config
server.servlet.context-path=/api/v1
spring.profiles.active=${SPRING_PROFILE_ACTIVE}
springdoc.swagger-ui.path=/swagger-ui.html
server.port=8080

## Spring Cloud Config - use local properties as fallback when config server unavailable
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false

## Logging
logging.level.root=INFO
logging.level.io.camunda.zeebe.client.impl.ZeebeCallCredentials= ERROR


## ERP service Serializer Format
SERVICE_CODE_FORMAT=string

## Spring batch process
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


preauth.validation.enabled=true

## Flyway Config
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

spring.application.name=claim-engineservice

management.tracing.enabled=true
management.tracing.export.enabled=false
management.tracing.sampling.probability=1.0

# One-line log format with clear, labeled context
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [app=${spring.application.name:-claim-service}] [traceId=%X{traceId:-} spanId=%X{spanId:-}] [userId=%X{userId:-}] [claimId=%X{claimId:-} claimType=%X{claimType:-} patientId=%X{patientId:-}] - %msg%n

ai.notes.retry.duration.second=2
ai.notes.retry.maxAttempt=3

## Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationService.slowCallRateThreshold=60
resilience4j.circuitbreaker.instances.notificationService.slowCallDurationThreshold=1500
resilience4j.circuitbreaker.instances.notificationService.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=50
resilience4j.circuitbreaker.instances.notificationService.minimumNumberOfCalls=20
resilience4j.circuitbreaker.instances.notificationService.waitDurationInOpenState=30000
resilience4j.circuitbreaker.instances.notificationService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.notificationService.slidingWindowType=TIME_BASED

# Enable timezone at Africa/Nariobi
spring.jackson.time-zone=Africa/Nairobi
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Nairobi

AES_SECRET_KEY=data-encyrption-key-1234567890123456
