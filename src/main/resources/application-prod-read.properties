## Postgres Azure DB PRODUCTION
spring.datasource.url=jdbc:postgresql://prod-db-replica-2.postgres.database.azure.com:5432/claim?&sslmode=require
spring.datasource.username=fhirproddbadmin
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#--
spring.datasource.hikari.pool-name=claims-prod-pool
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
# Detect connection leaks (e.g., forgotten close calls)
spring.datasource.hikari.leak-detection-threshold=10000
# 30 minutes (lifetime of a connection in the pool)
spring.datasource.hikari.max-lifetime=1800000

###  Enable logging for config troubleshooting

logging.level.org.hibernate.SQL=ERROR
