keycloak.eportal.name=eclaimportal
keycloak.realm=camunda-platform
keycloak.client-id=eclaims-app
keycloak.client-secret=
## Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.realm.uri}/auth/realms/camunda-platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

# JWT Configuration
jwt.auth.converter.resource-id=eclaims-app
jwt.auth.converter.principal-attribute=principal_username


