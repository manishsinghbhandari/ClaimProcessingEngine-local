# Spring boot config
server.servlet.context-path=/api/v1
server.port=8080

# Disable hibernate elasticsearch sniffer
spring.autoconfigure.exclude = org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
hibernate.search.backend.discovery.enabled = false

## Swagger Config
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.info.title=Payer API
springdoc.info.version=1.0.0
openapi.url=https://uat-payers.apeiro-digital.com

## Keycloak Configuration
keycloak.realm.uri=https://uat-auth.apeiro-digital.com
